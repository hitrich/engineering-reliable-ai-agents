<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 510" role="img" aria-labelledby="deployment-boundaries-title deployment-boundaries-desc"><title id="deployment-boundaries-title">Keep authority at the service boundary</title><desc id="deployment-boundaries-desc">Conceptual deployment view. The authenticated application supplies trusted context. The runtime controls execution and calls the external model. The tool service rechecks object-level authority and business rules before accessing the database. Restricted traces and receipts record observed execution. This is a design reference, not a deployed service.</desc><defs><marker id="arrow-deployment-boundaries" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#fff6e6"/></marker><filter id="grain-deployment-boundaries" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".65" numOctaves="3" seed="19" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feBlend in="SourceGraphic" mode="soft-light"/></filter></defs><rect width="900" height="510" fill="#075279"/><rect width="900" height="510" opacity=".13" filter="url(#grain-deployment-boundaries)" fill="#075279"/><path d="M18,40 V18 H62 M838,18 H882 V40 M18,470 V492 H62 M838,492 H882 V470" fill="none" stroke="#dfaa55" stroke-width="2"/><g font-family="Arial, sans-serif"><path d="M285.0,117.5 L330.0,117.5" fill="none" stroke="#fff6e6" stroke-width="2.5" marker-end="url(#arrow-deployment-boundaries)"/><rect x="285.9" y="32" width="43.2" height="25" fill="#075279"/><text x="307.5" y="50" text-anchor="middle" font-size="20" fill="#fff6e6">task</text><path d="M570.0,117.5 L615.0,117.5" fill="none" stroke="#fff6e6" stroke-width="2.5" marker-end="url(#arrow-deployment-boundaries)"/><rect x="522.3" y="32" width="140.4" height="25" fill="#075279"/><text x="592.5" y="50" text-anchor="middle" font-size="20" fill="#fff6e6">model request</text><path d="M450.0,170.0 L450.0,300.0" 