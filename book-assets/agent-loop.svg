<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="agent-loop-title agent-loop-desc"><title id="agent-loop-title">A bounded agent loop</title><desc id="agent-loop-desc">The model proposes; the runtime checks arguments and authority; the tool supplies data; the runtime saves observations, checks budgets and either continues or stops. Terminal states include answered, needs approval, stopped and failed. A text answer is not a verified business effect.</desc><defs><marker id="arrow-agent-loop" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#fff6e6"/></marker><filter id="grain-agent-loop" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".65" numOctaves="3" seed="19" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feBlend in="SourceGraphic" mode="soft-light"/></filter></defs><rect width="900" height="500" fill="#075279"/><rect width="900" height="500" opacity=".13" filter="url(#grain-agent-loop)" fill="#075279"/><path d="M18,40 V18 H62 M838,18 H882 V40 M18,460 V482 H62 M838,482 H882 V460" fill="none" stroke="#dfaa55" stroke-width="2"/><g font-family="Arial, sans-serif"><path d="M285.0,117.5 L330.0,117.5" fill="none" stroke="#fff6e6" stroke-width="2.5" marker-end="url(#arrow-agent-loop)"/><path d="M570.0,117.5 L615.0,117.5" fill="none" stroke="#fff6e6" stroke-width="2.5" marker-end="url(#arrow-agent-loop)"/><path d="M735.0,170.0 L735.0,295.0" fill="none" stroke="#fff6e6" stroke-width="2.5" marker-end="url(#arrow-agent-loop)"/><path d="M615.0,347.5 L570.0,347.5" fill="none" stroke="#fff6e6" stroke-width="2.5" marker-end="url(#arrow-agent-loop)"/><path d="M330.0,347.5 L285.0,347.5" fill="none" stroke="#fff6e6" stroke-width="2.5" marker-end="url(#arrow-agent-loop)"/><path d="M165.0,295.0 L165.0,170.0" fill="none" stroke="#fff6e6" stroke-width="2.5" marker-end="url(#arrow-agent-loop)"/><rect x="183.8" y="202.5" width="86.4" height="25" fill="#075279"/><text x="227.0" y="220.5" text-anchor="middle" font-size="20" fill="#fff6e6">continue</text><g data-node="model"><rect x="45" y="65" width="240" height="105" rx="0" fill="#fff8e9" stroke="#dfaa55" stroke-width="2"/><text x="165.0" y="111.5" text-anchor="middle" font-size="20" fill="#29251f">1. Model proposes an</text><text x="165.0" y="137.5" text-anchor="middle" font-size="20" fill="#29251f">action</text></g><g data-node="validate"><rect x="330" y="65" width="240" height="105" rx="0" fill="#fff8e9" stroke="#dfaa55" stroke-width="2"/><text x="450.0" y="111.5" text-anchor="middle" font-size="20" fill="#29251f">2. Runtime validates</text><text x="450.0" y="137.5" text-anchor="middle" font-size="20" fill="#29251f">and authorizes</text></g><g data-node="tool"><rect x="615" y="65" width="240" height="105" rx="0" fill="#fff8e9" stroke="#dfaa55" stroke-width="2"/><text x="735.0" y="111.5" text-anchor="middle" font-size="20" fill="#29251f">3. Tool returns an</text><text x="735.0" y="137.5" text-anchor="middle" font-size="20" fill="#29251f">observation</text></g><g data-node="context"><rect x="615" y="295" width="240" height="105" rx="0" fill="#fff8e9" stroke="#dfaa55" stroke-width="2"/><text x="735.0" y="341.5" text-anchor="middle" font-size="20" fill="#29251f">4. Save observation</text><text x="735.0" y="367.5" text-anchor="middle" font-size="20" fill="#29251f">and task state</text></g><g data-node="check"><rect x="330" y="295" width="240" height="105" rx="0" fill="#fff8e9" stroke="#dfaa55" stroke-width="2"/><text x="450.0" y="341.5" text-anchor="middle" font-size="20" fill="#29251f">5. Check evidence</text><text x="450.0" y="367.5" text-anchor="middle" font-size="20" fill="#29251f">and remaining budget</text></g><g data-node="stop"><rect x="45" y="295" width="240" height="105" rx="0" fill="#fff8e9" stroke="#dfaa55" stroke-width="2"/><text x="165.0" y="341.5" text-anchor="middle" font-size="20" fill="#29251f">6. Continue or enter</text><text x="165.0" y="367.5" text-anchor="middle" font-size="20" fill="#29251f">a terminal state</text></g></g></svg>