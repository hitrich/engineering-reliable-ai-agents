<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 510" role="img" aria-labelledby="evaluation-pipeline-title evaluation-pipeline-desc"><title id="evaluation-pipeline-title">Separate cases, families and repeated trials</title><desc id="evaluation-pipeline-desc">The companion contains 200 original scenario specifications in 40 families. Entire families remain in development or held-out sets. Three trials per held-out case would produce 240 runs per configuration. These live trials were not executed. Five variants in a family are related, and repeats do not create independent tasks.</desc><defs><marker id="arrow-evaluation-pipeline" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#fff6e6"/></marker><filter id="grain-evaluation-pipeline" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".65" numOctaves="3" seed="19" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feBlend in="SourceGraphic" mode="soft-light"/></filter></defs><rect width="900" height="510" fill="#075279"/><rect width="900" height="510" opacity=".13" filter="url(#grain-evaluation-pipeline)" fill="#075279"/><path d="M18,40 V18 H62 M838,18 H882 V40 M18,470 V492 H62 M838,492 H882 V470" fill="none" stroke="#dfaa55" stroke-width="2"/><g font-family="Arial, sans-serif"><path d="M285.0,117.5 L330.0,117.5" fill="none" stroke="#fff6e6" stroke-width="2.5" marker-end="url(#arrow-evaluation-pipeline)"/><path d="M570.0,117.5 L615.0,117.5" fill="none" stroke="#fff6e6" stroke-width="2.5" marker-end="url(#arrow-evaluation-pipeline)"/><path d="M450.0,170.0 L165.0,300.0" fill="none" stroke="#fff6e6" stroke-width="2.5" marker-end="url(#arrow-evaluation-pipeline)"/><path d="M285.0,352.5 L330.0,352.5" fill="none" stroke="#fff6e6" stroke-width="2.5" marker-end="url(#arrow-evaluation-pipeline)"/><path d="M735.0,170.0 L450.0,300.0" fill="none" stroke="#fff6e6" stroke-width="2.5" marker-end="url(#arrow-evaluation-pipeline)"/><rect x="511.5" y="205.0" width="162.0" height="25" fill="#075279"/><text x="592.5" y="223.0" text-anchor="middle" font-size="20" fill="#fff6e6">freeze settings</text><path d="M570.0,352.5 L615.0,352.5" fill="none" stroke="#fff6e6" stroke-width="2.5" marker-end="url(#arrow-evaluation-pipeline)"/><g data-node="cases"><rect x="45" y="65" width="240" height="105" rx="0" fill="#fff8e9" stroke="#dfaa55" stroke-width="2"/><text x="165.0" y="98.5" text-anchor="middle" font-size="20" fill="#29251f">200 synthetic</text><text x="165.0" y="124.5" text-anchor="middle" font-size="20" fill="#29251f">scenario</text><text x="165.0" y="150.5" text-anchor="middle" font-size="20" fill="#29251f">specifications</text></g><g data-node="families"><rect x="330" y="65" width="240" height="105" rx="0" fill="#fff8e9" stroke="#dfaa55" stroke-width="2"/><text x="450.0" y="111.5" text-anchor="middle" font-size="20" fill="#29251f">40 related task</text><text x="450.0" y="137.5" text-anchor="middle" font-size="20" fill="#29251f">families</text></g><g data-node="dev"><rect x="615" y="65" width="240" height="105" rx="0" fill="#fff8e9" stroke="#dfaa55" stroke-width="2"/><text x="735.0" y="111.5" text-anchor="middle" font-size="20" fill="#29251f">120 development</text><text x="735.0" y="137.5" text-anchor="middle" font-size="20" fill="#29251f">cases</text></g><g data-node="heldout"><rect x="45" y="300" width="240" height="105" rx="0" fill="#fff8e9" stroke="#dfaa55" stroke-width="2"/><text x="165.0" y="359.5" text-anchor="middle" font-size="20" fill="#29251f">80 held-out cases</text></g><g data-node="trials"><rect x="330" y="300" width="240" height="105" rx="0" fill="#fff8e9" stroke="#dfaa55" stroke-width="2"/><text x="450.0" y="333.5" text-anchor="middle" font-size="20" fill="#29251f">3 repeats = 240</text><text x="450.0" y="359.5" text-anchor="middle" font-size="20" fill="#29251f">planned trials /</text><text x="450.0" y="385.5" text-anchor="middle" font-size="20" fill="#29251f">configuration</text></g><g data-node="grade"><rect x="615" y="300" width="240" height="105" rx="0" fill="#fff8e9" stroke="#dfaa55" stroke-width="2"/><text x="735.0" y="333.5" text-anchor="middle" font-size="20" fill="#29251f">Grade outcomes,</text><text x="735.0" y="359.5" text-anchor="middle" font-size="20" fill="#29251f">behavior and total</text><text x="735.0" y="385.5" text-anchor="middle" font-size="20" fill="#29251f">work</text></g></g></svg>