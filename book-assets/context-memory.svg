<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" role="img" aria-labelledby="context-memory-title context-memory-desc"><title id="context-memory-title">Context is a selected view</title><desc id="context-memory-desc">Five sources remain distinct. The context builder selects information for one invocation. Business records retain authority; summaries and memories do not become permissions. Scope, version, freshness and provenance travel with selected evidence.</desc><defs><marker id="arrow-context-memory" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#fff6e6"/></marker><filter id="grain-context-memory" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".65" numOctaves="3" seed="19" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feBlend in="SourceGraphic" mode="soft-light"/></filter></defs><rect width="900" height="700" fill="#075279"/><rect width="900" height="700" opacity=".13" filter="url(#grain-context-memory)" fill="#075279"/><path d="M18,40 V18 H62 M838,18 H882 V40 M18,660 V682 H62 M838,682 H882 V660" fill="none" stroke="#dfaa55" stroke-width="2"/><g font-family="Arial, sans-serif"><path d="M335,107.5 C430,107.5 440,305 520,305" fill="none" stroke="#fff6e6" stroke-width="2.5" marker-end="url(#arrow-context-memory)"/><path d="M335,227.5 C430,227.5 440,329 520,329" fill="none" stroke="#fff6e6" stroke-width="2.5" marker-end="url(#arrow-context-memory)"/><path d="M335,347.5 C430,347.5 440,353 520,353" fill="none" stroke="#fff6e6" stroke-width="2.5" marker-end="url(#arrow-context-memory)"/><path d="M335,467.5 C430,467.5 440,377 520,377" fill="none" stroke="#fff6e6" stroke-width="2.5" marker-end="url(#arrow-context-memory)"/><path d="M335,587.5 C430,587.5 440,401 520,401" fill="none" stroke="#fff6e6" stroke-width="2.5" marker-end="url(#arrow-context-memory)"/><g data-node="records"><rect x="45" y="65" width="290" height="85" rx="0" fill="#fff8e9" stroke="#dfaa55" stroke-width="2"/><text x="190.0" y="101.5" text-anchor="middle" font-size="20" fill="#29251f">Authoritative business</text><text x="190.0" y="127.5" text-anchor="middle" font-size="20" fill="#29251f">records</text></g><g data-node="state"><rect x="45" y="185" width="290" height="85" rx="0" fill="#fff8e9" stroke="#dfaa55" stroke-width="2"/><text x="190.0" y="234.5" text-anchor="middle" font-size="20" fill="#29251f">Durable task checkpoint</text></g><g data-node="history"><rect x="45" y="305" width="290" height="85" rx="0" fill="#fff8e9" stroke="#dfaa55" stroke-width="2"/><text x="190.0" y="341.5" text-anchor="middle" font-size="20" fill="#29251f">Conversation with</text><text x="190.0" y="367.5" text-anchor="middle" font-size="20" fill="#29251f">speakers and times</text></g><g data-node="knowledge"><rect x="45" y="425" width="290" height="85" rx="0" fill="#fff8e9" stroke="#dfaa55" stroke-width="2"/><text x="190.0" y="461.5" text-anchor="middle" font-size="20" fill="#29251f">Versioned knowledge and</text><text x="190.0" y="487.5" text-anchor="middle" font-size="20" fill="#29251f">provenance</text></g><g data-node="memory"><rect x="45" y="545" width="290" height="85" rx="0" fill="#fff8e9" stroke="#dfaa55" stroke-width="2"/><text x="190.0" y="581.5" text-anchor="middle" font-size="20" fill="#29251f">Reviewed memory with</text><text x="190.0" y="607.5" text-anchor="middle" font-size="20" fill="#29251f">scope and expiry</text></g><g data-node="context"><rect x="520" y="285" width="330" height="135" rx="0" fill="#fff8e9" stroke="#dfaa55" stroke-width="2"/><text x="685.0" y="333.5" text-anchor="middle" font-size="20" fill="#29251f">Context builder selects</text><text x="685.0" y="359.5" text-anchor="middle" font-size="20" fill="#29251f">relevant authorized</text><text x="685.0" y="385.5" text-anchor="middle" font-size="20" fill="#29251f">information</text></g></g></svg>