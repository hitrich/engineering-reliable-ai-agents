<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 670" role="img" aria-labelledby="approval-transaction-title approval-transaction-desc"><title id="approval-transaction-title">Approval binds one exact operation</title><desc id="approval-transaction-desc">The action service stores an exact proposal and evidence snapshot. A reviewer approves its digest. Commit rechecks current scope, original reviewer, expiry, integrity, evidence and ticket version inside the local transaction. A repeated key returns the protected original receipt; it does not repeat the effect.</desc><defs><marker id="arrow-approval-transaction" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#fff6e6"/></marker><filter id="grain-approval-transaction" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".65" numOctaves="3" seed="19" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feBlend in="SourceGraphic" mode="soft-light"/></filter></defs><rect width="900" height="670" fill="#075279"/><rect width="900" height="670" opacity=".13" filter="url(#grain-approval-transaction)" fill="#075279"/><path d="M18,40 V18 H62 M838,18 H882 V40 M18,630 V652 H62 M838,652 H882 V630" fill="none" stroke="#dfaa55" stroke-width="2"/><g font-family="Arial, sans-serif"><line x1="115.0" y1="90" x2="115.0" y2="610" stroke="#77a2b1" stroke-dasharray="5 6"/><line x1="320.0" y1="90" x2="320.0" y2="610" stroke="#77a2b1" stroke-dasharray="5 6"/><line x1="555.0" y1="90" x2="555.0" y2="610" stroke="#77a2b1" stroke-dasharray="5 6"/><line x1="780.0" y1="90" x2="780.0" y2="610" stroke="#77a2b1" stroke-dasharray="5 6"/><path d="M115.0,125 L555.0,125" fill="none" stroke="#fff6e6" stroke-width="2.5" marker-end="url(#arrow-approval-transaction)"/><text x="335.0" y="113" text-anchor="middle" font-size="20" fill="#fff6e6">propose exact change</text><path d="M555.0,190 L780.0,190" fill="none" stroke="#fff6e6" stroke-width="2.5" marker-end="url(#arrow-approval-transaction)"/><text x="667.5" y="178" text-anchor="middle" font-size="20" fill="#fff6e6">read evidence</text><path d="M780.0,255 L555.0,255" fill="none" stroke="#fff6e6" stroke-width="2.5" marker-end="url(#arrow-approval-transaction)"/><text x="667.5" y="243" text-anchor="middle" font-size="20" fill="#fff6e6">return snapshot</text><path d="M555.0,320 L320.0,320" fill="none" stroke="#fff6e6" stroke-width="2.5" marker-end="url(#arrow-approval-transaction)"/><text x="437.5" y="308" text-anchor="middle" font-size="20" fill="#fff6e6">show exact payload</text><path d="M320.0,385 L555.0,385" fill="none" stroke="#fff6e6" stroke-width="2.5" marker-end="url(#arrow-approval-transaction)"/><text x="437.5" y="373" text-anchor="middle" font-size="20" fill="#fff6e6">approve digest</text><path d="M555.0,450 L780.0,450" fill="none" stroke="#fff6e6" stroke-width="2.5" marker-end="url(#arrow-approval-transaction)"/><text x="667.5" y="438" text-anchor="middle" font-size="20" fill="#fff6e6">recheck + commit</text><path d="M780.0,515 L555.0,515" fill="none" stroke="#fff6e6" stroke-width="2.5" marker-end="url(#arrow-approval-transaction)"/><text x="667.5" y="503" text-anchor="middle" font-size="20" fill="#fff6e6">persist receipt</text><path d="M555.0,580 L320.0,580" fill="none" stroke="#fff6e6" stroke-width="2.5" marker-end="url(#arrow-approval-transaction)"/><text x="437.5" y="568" text-anchor="middle" font-size="20" fill="#fff6e6">verified result</text><g data-node="agent"><rect x="50" y="30" width="130" height="55" rx="0" fill="#fff8e9" stroke="#dfaa55" stroke-width="2"/><text x="115.0" y="64.5" text-anchor="middle" font-size="20" fill="#29251f">Agent</text></g><g data-node="reviewer"><rect x="245" y="30" width="150" height="55" rx="0" fill="#fff8e9" stroke="#dfaa55" stroke-width="2"/><text x="320.0" y="64.5" text-anchor="middle" font-size="20" fill="#29251f">Reviewer</text></g><g data-node="service"><rect x="460" y="30" width="190" height="55" rx="0" fill="#fff8e9" stroke="#dfaa55" stroke-width="2"/><text x="555.0" y="64.5" text-anchor="middle" font-size="20" fill="#29251f">Action service</text></g><g data-node="database"><rect x="705" y="30" width="150" height="55" rx="0" fill="#fff8e9" stroke="#dfaa55" stroke-width="2"/><text x="780.0" y="64.5" text-anchor="middle" font-size="20" fill="#29251f">Database</text></g></g></svg>