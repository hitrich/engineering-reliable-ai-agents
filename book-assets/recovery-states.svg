<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 510" role="img" aria-labelledby="recovery-states-title recovery-states-desc"><title id="recovery-states-title">Recovery preserves the operation identity</title><desc id="recovery-states-desc">Conceptual service states: investigate, wait for review, and attempt commit. A verified receipt establishes the effect. An unknown write outcome requires reconciliation using the same operation identity. Stale evidence requires refresh and new review. The CLI implements a subset of this service lifecycle.</desc><defs><marker id="arrow-recovery-states" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#fff6e6"/></marker><filter id="grain-recovery-states" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".65" numOctaves="3" seed="19" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feBlend in="SourceGraphic" mode="soft-light"/></filter></defs><rect width="900" height="510" fill="#075279"/><rect width="900" height="510" opacity=".13" filter="url(#grain-recovery-states)" fill="#075279"/><path d="M18,40 V18 H62 M838,18 H882 V40 M18,470 V492 H62 M838,492 H882 V470" fill="none" stroke="#dfaa55" stroke-width="2"/><g font-family="Arial, sans-serif"><path d="M285.0,117.5 L330.0,117.5" fill="none" stroke="#fff6e6" stroke-width="2.5" marker-end="url(#arrow-recovery-states)"/><path d="M570.0,117.5 L615.0,117.5" fill="none" stroke="#fff6e6" stroke-width="2.5" marker-end="url(#arrow-recovery-states)"/><rect x="546.8" y="27" width="86.4" height="25" fill="#075279"/><text x="590" y="45" text-anchor="middle" font-size="20" fill="#fff6e6">approved</text><path d="M735.0,170.0 L735.0,300.0" fill="none" stroke="#fff6e6" stroke-width="2.5" marker-end="url(#arrow-recovery-states)"/><rect x="772.2" y="227" width="75.60000000000001" height="25" fill="#075279"/><text x="810" y="245" text-anchor="middle" font-size="20" fill="#fff6e6">receipt</text><path d="M735.0,170.0 L450.0,300.0" fill="none" stroke="#fff6e6" stroke-width="2.5" marker-end="url(#arrow-recovery-states)"/><rect x="582.2" y="217" width="75.60000000000001" height="25" fill="#075279"/><text x="620" y="235" text-anchor="middle" font-size="20" fill="#fff6e6">timeout</text><path d="M450.0,405 V465 H735.0 V405" fill="none" stroke="#fff6e6" stroke-width="2.5" marker-end="url(#arrow-recovery-states)"/><rect x="525.2" y="476" width="129.60000000000002" height="25" fill="#075279"/><text x="590" y="494" text-anchor="middle" font-size="20" fill="#fff6e6">found result</text><path d="M450.0,170.0 L165.0,300.0" fill="none" stroke="#fff6e6" stroke-width="2.5" marker-end="url(#arrow-recovery-states)"/><rect x="239.0" y="207" width="162.0" height="25" fill="#075279"/><text x="320" y="225" text-anchor="middle" font-size="20" fill="#fff6e6">stale / expired</text><path d="M165.0,300.0 L165.0,170.0" fill="none" stroke="#fff6e6" stroke-width="2.5" marker-end="url(#arrow-recovery-states)"/><rect x="47.599999999999994" y="232" width="64.80000000000001" height="25" fill="#075279"/><text x="80" y="250" text-anchor="middle" font-size="20" fill="#fff6e6">resume</text><g data-node="investigate"><rect x="45" y="65" width="240" height="105" rx="0" fill="#fff8e9" stroke="#dfaa55" stroke-width="2"/><text x="165.0" y="124.5" text-anchor="middle" font-size="20" fill="#29251f">Investigate</text></g><g data-node="review"><rect x="330" y="65" width="240" height="105" rx="0" fill="#fff8e9" stroke="#dfaa55" stroke-width="2"/><text x="450.0" y="124.5" text-anchor="middle" font-size="20" fill="#29251f">Wait for review</text></g><g data-node="commit"><rect x="615" y="65" width="240" height="105" rx="0" fill="#fff8e9" stroke="#dfaa55" stroke-width="2"/><text x="735.0" y="124.5" text-anchor="middle" font-size="20" fill="#29251f">Commit</text></g><g data-node="refresh"><rect x="45" y="300" width="240" height="105" rx="0" fill="#fff8e9" stroke="#dfaa55" stroke-width="2"/><text x="165.0" y="346.5" text-anchor="middle" font-size="20" fill="#29251f">Refresh evidence or</text><text x="165.0" y="372.5" text-anchor="middle" font-size="20" fill="#29251f">stop</text></g><g data-node="reconcile"><rect x="330" y="300" width="240" height="105" rx="0" fill="#fff8e9" stroke="#dfaa55" stroke-width="2"/><text x="450.0" y="346.5" text-anchor="middle" font-size="20" fill="#29251f">Reconcile unknown</text><text x="450.0" y="372.5" text-anchor="middle" font-size="20" fill="#29251f">outcome</text></g><g data-node="verified"><rect x="615" y="300" width="240" height="105" rx="0" fill="#fff8e9" stroke="#dfaa55" stroke-width="2"/><text x="735.0" y="359.5" text-anchor="middle" font-size="20" fill="#29251f">Verified effect</text></g></g></svg>